services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon-agent-app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    environment:
      - PORT=${PORT:-3000}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-syllabot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-syllabot}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID:-}
      - COPILOTKIT_RUNTIME_URL=http://frontend:3001/api/copilotkit
      - SEARXNG_URL=http://searxng:8080
      - TRANSCRIPT_SERVICE_URL=http://transcript:8000
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      transcript:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon-agent-frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - COPILOTKIT_TELEMETRY_DISABLED=true
      - BACKEND_INTERNAL_URL=http://app:3000
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      # CopilotKit usa el protocolo OpenAI contra el endpoint compatible de OpenRouter.
      - OPENAI_API_KEY=${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hackathon-agent-qdrant
    ports:
      - "127.0.0.1:6333:6333" # Dashboard sólo en este equipo
      - "127.0.0.1:6334:6334" # gRPC sólo en este equipo
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: hackathon-agent-neo4j
    ports:
      - "127.0.0.1:7474:7474" # Browser sólo en este equipo
      - "127.0.0.1:7687:7687" # Bolt sólo en este equipo
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: hackathon-agent-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-syllabot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-syllabot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syllabot} -d ${POSTGRES_DB:-syllabot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18 administra subdirectorios por versión bajo este mount.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: hackathon-agent-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=Syllabot-Search
    restart: unless-stopped

  transcript:
    build:
      context: ./services/transcript
      dockerfile: Dockerfile
    container_name: hackathon-agent-transcript
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
  postgres_data:
